# The engine manifest (docs/interface.md, section 16.6): how PlumCraft starts this engine.
id = "duckdb"
name = "DuckDB"
mode = "process"
command = ["uv", "run", "--quiet", "--project", ".", "python", "-m", "plumcraft_duckdb"]
cwd = "."
restart = "on-crash"
max_restarts = 5
hint = "uv sync, in this project"
demo = "examples/demo.json"

[conformance]
slow = "duckdb.slow"
